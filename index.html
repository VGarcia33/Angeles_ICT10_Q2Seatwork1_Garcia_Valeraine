<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB VERIFICATION</title>

    <style>
        

        .container {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: #645394;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        h1,p{
            color: #D8BFD8;
        }

        .box{
            background-color: #9E77B5;
            padding: 25px;
            border-radius: 8px;
            width: 340px;
            max-width: 100%;
        }
        

        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
        }
        
        select, input, button {
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border-radius: 4px; 
            border: 1px solid #D8BFD8;
            box-sizing: border-box;
         }

         button{
            background-color: #743089;
            color:  #D8BFD8;
         }
    </style> 
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

</head>
<body class="container">
    <h1> ICT CLUB CHECKER</h1>
    <p>Candidate Verification System</p>

    <div class="box">
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" placeholder="Enter your First Name">
        <br><br>

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" placeholder="Enter your Last Name">
        <br><br>

        <button type="button" py-click="check_members">Enter</button>

        <p id="message"></p>

        <py-script src="main.py"></py-script>

    </div>



</body>
</html>
